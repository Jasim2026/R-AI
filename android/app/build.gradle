plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.r_ai"
    compileSdk 35
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "com.example.r_ai"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

}

flutter {
    source "../.."
}

dependencies {
    implementation("com.google.ai.edge.litertlm:litertlm-android:latest.release")
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"

    // MediaPipe Text Embedding (all-MiniLM-L6-v2)
    implementation "com.google.mediapipe:tasks-text:0.10.14"

    // ObjectBox for vector search
    implementation "io.objectbox:objectbox-android:4.0.1"
    implementation "io.objectbox:objectbox-kotlin:4.0.1"
}
