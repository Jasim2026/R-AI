plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.r_ai"
    compileSdk 35
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "com.example.r_ai"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

}

flutter {
    source "../.."
}

dependencies {
    // Pin to 0.14.0 — built against kotlinx-coroutines 1.11.0, POM wrongly declares 1.9.0
    // See: https://github.com/google-ai-edge/LiteRT-LM/issues/2812
    implementation("com.google.ai.edge.litertlm:litertlm-android:0.14.0")
    // Must be 1.11.0+ to match the bytecode litertlm-android was compiled against
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
}
