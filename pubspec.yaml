name: r_ai
description: On-device LLM inference app with NPU/GPU acceleration via LiteRT.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  uuid: ^4.2.1
  file_picker: ^6.1.1
  permission_handler: ^11.3.1
  flutter_markdown: ^0.7.4+3
  flutter_markdown_latex: ^0.3.4
  flutter_math_fork: ^0.7.0

dev_dependencies:
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
